# 🐳 TheSim - Production Docker Compose с Nginx + SSL

services:
  # Next.js приложение
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thesim-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    networks:
      - thesim-network
    expose:
      - "3000"

  # Nginx с SSL
  nginx:
    image: nginx:alpine
    container_name: thesim-nginx
    restart: unless-stopped
    ports:
      - "80:80"      # HTTP
      - "443:443"    # HTTPS
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro  # Let's Encrypt сертификаты
      - ./public:/var/www/html:ro
    depends_on:
      - app
    networks:
      - thesim-network

networks:
  thesim-network:
    driver: bridge

volumes:
  data:
