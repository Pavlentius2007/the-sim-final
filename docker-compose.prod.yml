# 🐳 TheSim - Production Docker Compose с Nginx + SSL

services:
  # Next.js приложение
  app:
    image: node:18-alpine
    container_name: thesim-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HTTPS_PORT=3001
      - HOSTNAME=0.0.0.0
      - ALLOWED_ORIGINS=http://localhost:3000,https://thesim.site,https://www.thesim.site
    volumes:
      - ./app:/app/app
      - ./components:/app/components
      - ./hooks:/app/hooks
      - ./lib:/app/lib
      - ./messages:/app/messages
      - ./types:/app/types
      - ./utils:/app/utils
      - ./.next:/app/.next
      - ./public:/app/public
      - ./package.json:/app/package.json
      - ./next.config.js:/app/next.config.js
      - ./tsconfig.json:/app/tsconfig.json
      - ./tailwind.config.js:/app/tailwind.config.js
      - ./postcss.config.js:/app/postcss.config.js
      - ./app/globals.css:/app/app/globals.css
      - ./data:/app/data
      - ./ssl:/app/ssl  # Добавляем SSL сертификаты
    working_dir: /app
    command: sh -c "npm install --include=dev && npm run build && node .next/standalone/server.js"
    networks:
      - thesim-network
    expose:
      - "3000"

  # Nginx с SSL
  nginx:
    image: nginx:alpine
    container_name: thesim-nginx
    restart: unless-stopped
    ports:
      - "80:80"      # HTTP
      - "443:443"    # HTTPS
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro  # Let's Encrypt сертификаты
      - ./public:/var/www/html:ro
    depends_on:
      - app
    networks:
      - thesim-network

networks:
  thesim-network:
    driver: bridge

volumes:
  data:
