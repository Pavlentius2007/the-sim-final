# 🐳 CosmicLanding - Docker Compose (использует готовую сборку)
services:
  cosmiclanding:
    image: node:18-alpine
    container_name: cosmiclanding-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - ALLOWED_ORIGINS=http://localhost:3000,https://thesim.site,https://www.thesim.site
    volumes:
      - ./app:/app/app
      - ./components:/app/components
      - ./hooks:/app/hooks
      - ./lib:/app/lib
      - ./messages:/app/messages
      - ./types:/app/types
      - ./utils:/app/utils
      - ./.next:/app/.next
      - ./public:/app/public
      - ./package.json:/app/package.json
      - ./next.config.js:/app/next.config.js
      - ./tsconfig.json:/app/tsconfig.json
      - ./tailwind.config.js:/app/tailwind.config.js
      - ./postcss.config.js:/app/postcss.config.js
      - ./app/globals.css:/app/app/globals.css
      - ./data:/app/data
    working_dir: /app
    command: sh -c "npm install && npm run build && npm start"
    networks:
      - cosmiclanding-network

networks:
  cosmiclanding-network:
    driver: bridge

volumes:
  data: