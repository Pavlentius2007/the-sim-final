# 🐳 TheSim - HTTP Docker Compose (без SSL)
version: '3.8'

services:
  # Next.js приложение
  app:
    image: node:18-alpine
    container_name: thesim-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ALLOWED_ORIGINS=http://thesim.site,http://www.thesim.site,http://localhost:3000
    volumes:
      - ./app:/app/app
      - ./components:/app/components
      - ./hooks:/app/hooks
      - ./lib:/app/lib
      - ./messages:/app/messages
      - ./types:/app/types
      - ./utils:/app/utils
      - ./.next:/app/.next
      - ./public:/app/public
      - ./package.json:/app/package.json
      - ./next.config.js:/app/next.config.js
      - ./tsconfig.json:/app/tsconfig.json
      - ./tailwind.config.js:/app/tailwind.config.js
      - ./postcss.config.js:/app/postcss.config.js
      - ./app/globals.css:/app/app/globals.css
      - ./data:/app/data
    working_dir: /app
    command: sh -c "npm install --include=dev && npm run build && npm start"
    networks:
      - thesim-network
    expose:
      - "3000"

  # Nginx без SSL
  nginx:
    image: nginx:alpine
    container_name: thesim-nginx
    restart: unless-stopped
    ports:
      - "80:80"      # HTTP
    volumes:
      - ./nginx-http.conf:/etc/nginx/nginx.conf:ro
      - ./public:/var/www/html:ro
    depends_on:
      - app
    networks:
      - thesim-network

networks:
  thesim-network:
    driver: bridge

volumes:
  data:
